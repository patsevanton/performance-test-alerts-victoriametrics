apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: {{ include "golden-signal-app.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "golden-signal-app.labels" . | nindent 4 }}
spec:
  groups:
    - name: {{ include "golden-signal-app.name" . }}-alerts
      interval: {{ .Values.alerts.evaluationInterval | default "1m" }}
      rules:
        {{- if .Values.alerts.errors.enabled }}
        - alert: HighErrorRate
          expr: |
            (
              rate(app_errors_total{job="{{ include "golden-signal-app.name" . }}"}[5m])
              /
              rate(app_requests_total{job="{{ include "golden-signal-app.name" . }}"}[5m])
            ) > {{ .Values.alerts.errors.threshold }}
          for: 1m
          labels:
            severity: {{ .Values.alerts.errors.severity }}
            app: {{ include "golden-signal-app.name" . }}
          annotations:
            summary: "High error rate on {{ include "golden-signal-app.name" . }}"
            description: "{{ .Values.alerts.errors.description }}. Error rate is {{ `{{ $value | humanize }}` }}"
        {{- end }}
        {{- if .Values.alerts.criticalErrors.enabled }}
        - alert: CriticalErrorRate
          expr: |
            (
              rate(app_errors_total{job="{{ include "golden-signal-app.name" . }}"}[5m])
              /
              clamp_min(rate(app_requests_total{job="{{ include "golden-signal-app.name" . }}"}[5m]), 0.001)
            ) > {{ .Values.alerts.criticalErrors.threshold }}
          for: 1m
          labels:
            severity: {{ .Values.alerts.criticalErrors.severity }}
            app: {{ include "golden-signal-app.name" . }}
          annotations:
            summary: "Critical error rate on {{ include "golden-signal-app.name" . }}"
            description: "{{ .Values.alerts.criticalErrors.description }}. Error rate is {{ `{{ $value | humanize }}` }}"
        {{- end }}
        {{- if .Values.alerts.latency.enabled }}
        - alert: HighLatency
          expr: |
            histogram_quantile(0.95,
              sum(rate(app_request_latency_seconds_bucket{job="{{ include "golden-signal-app.name" . }}"}[5m])) by (le)
            ) > {{ .Values.alerts.latency.threshold }}
          for: 2m
          labels:
            severity: {{ .Values.alerts.latency.severity }}
            app: {{ include "golden-signal-app.name" . }}
          annotations:
            summary: "High latency on {{ include "golden-signal-app.name" . }}"
            description: "{{ .Values.alerts.latency.description }}. P95 latency is {{ `{{ $value }}` }}s"
        {{- end }}
        {{- if .Values.alerts.latencyP99.enabled }}
        - alert: HighLatencyP99
          expr: |
            histogram_quantile(0.99,
              sum(rate(app_request_latency_seconds_bucket{job="{{ include "golden-signal-app.name" . }}"}[5m])) by (le)
            ) > {{ .Values.alerts.latencyP99.threshold }}
          for: 2m
          labels:
            severity: {{ .Values.alerts.latencyP99.severity }}
            app: {{ include "golden-signal-app.name" . }}
          annotations:
            summary: "High p99 latency on {{ include "golden-signal-app.name" . }}"
            description: "{{ .Values.alerts.latencyP99.description }}. P99 latency is {{ `{{ $value }}` }}s"
        {{- end }}
        {{- if .Values.alerts.avgLatency.enabled }}
        - alert: HighAverageLatency
          expr: |
            (
              rate(app_request_latency_seconds_sum{job="{{ include "golden-signal-app.name" . }}"}[5m])
              /
              clamp_min(rate(app_request_latency_seconds_count{job="{{ include "golden-signal-app.name" . }}"}[5m]), 0.001)
            ) > {{ .Values.alerts.avgLatency.threshold }}
          for: 2m
          labels:
            severity: {{ .Values.alerts.avgLatency.severity }}
            app: {{ include "golden-signal-app.name" . }}
          annotations:
            summary: "High average latency on {{ include "golden-signal-app.name" . }}"
            description: "{{ .Values.alerts.avgLatency.description }}. Average latency is {{ `{{ $value }}` }}s"
        {{- end }}
        {{- if .Values.alerts.goroutines.enabled }}
        - alert: HighGoroutineCount
          expr: |
            app_goroutines{job="{{ include "golden-signal-app.name" . }}"} > {{ .Values.alerts.goroutines.threshold }}
          for: 1m
          labels:
            severity: {{ .Values.alerts.goroutines.severity }}
            app: {{ include "golden-signal-app.name" . }}
          annotations:
            summary: "High goroutines on {{ include "golden-signal-app.name" . }}"
            description: "{{ .Values.alerts.goroutines.description }}. Current value is {{ `{{ $value }}` }}"
        {{- end }}
        {{- if .Values.alerts.criticalGoroutines.enabled }}
        - alert: CriticalGoroutineCount
          expr: |
            app_goroutines{job="{{ include "golden-signal-app.name" . }}"} > {{ .Values.alerts.criticalGoroutines.threshold }}
          for: 1m
          labels:
            severity: {{ .Values.alerts.criticalGoroutines.severity }}
            app: {{ include "golden-signal-app.name" . }}
          annotations:
            summary: "Critical goroutines on {{ include "golden-signal-app.name" . }}"
            description: "{{ .Values.alerts.criticalGoroutines.description }}. Current value is {{ `{{ $value }}` }}"
        {{- end }}
        {{- if .Values.alerts.lowTraffic.enabled }}
        - alert: LowTraffic
          expr: |
            rate(app_requests_total{job="{{ include "golden-signal-app.name" . }}"}[5m]) < {{ .Values.alerts.lowTraffic.threshold }}
          for: 5m
          labels:
            severity: {{ .Values.alerts.lowTraffic.severity }}
            app: {{ include "golden-signal-app.name" . }}
          annotations:
            summary: "Low traffic on {{ include "golden-signal-app.name" . }}"
            description: "{{ .Values.alerts.lowTraffic.description }}. Request rate is {{ `{{ $value }}` }} req/s"
        {{- end }}
        {{- if .Values.alerts.trafficSpike.enabled }}
        - alert: TrafficSpike
          expr: |
            rate(app_requests_total{job="{{ include "golden-signal-app.name" . }}"}[1m]) > {{ .Values.alerts.trafficSpike.threshold }}
          for: 1m
          labels:
            severity: {{ .Values.alerts.trafficSpike.severity }}
            app: {{ include "golden-signal-app.name" . }}
          annotations:
            summary: "Traffic spike on {{ include "golden-signal-app.name" . }}"
            description: "{{ .Values.alerts.trafficSpike.description }}. Request rate is {{ `{{ $value }}` }} req/s"
        {{- end }}
        {{- if .Values.alerts.errorBurst.enabled }}
        - alert: ErrorBurst
          expr: |
            increase(app_errors_total{job="{{ include "golden-signal-app.name" . }}"}[2m]) > {{ .Values.alerts.errorBurst.threshold }}
          for: 1m
          labels:
            severity: {{ .Values.alerts.errorBurst.severity }}
            app: {{ include "golden-signal-app.name" . }}
          annotations:
            summary: "Error burst on {{ include "golden-signal-app.name" . }}"
            description: "{{ .Values.alerts.errorBurst.description }}. Errors in 2m are {{ `{{ $value }}` }}"
        {{- end }}
        {{- if .Values.alerts.extra.enabled }}
        {{- $appName := include "golden-signal-app.name" . }}
        {{- range $i := until (int .Values.alerts.extra.count) }}
        {{- /* Первые 20 правил — тяжёлый PromQL, остальные — простой профиль */}}
        {{- $heavy := lt $i 20 }}
        - alert: ExtraAlert{{ printf "%03d" (add $i 1) }}
          expr: |
            {{- if $heavy }}
            {{- /* 30% subqueries (6 правил: i=0..5) */}}
            {{- if lt $i 6 }}
            {{- if eq (mod $i 2) 0 }}
            max_over_time(rate(app_errors_total{job="{{ $appName }}",status_code=~"5.."}[5m])[5m:1m]) > {{ add 20 $i }}
            {{- else }}
            changes(app_errors_total{job="{{ $appName }}",status_code=~"5.."}[10m]) > {{ add 30 $i }}
            {{- end }}
            {{- /* 25% joins (5 правил: i=6..10) */}}
            {{- else if lt $i 11 }}
            {{- if eq (mod $i 2) 0 }}
            rate(app_errors_total{job="{{ $appName }}"}[5m]) * on(route,tenant_id) group_left(region) sum by(route,tenant_id,region) (rate(app_requests_total{job="{{ $appName }}"}[5m])) > {{ add 40 $i }}
            {{- else if eq $i 7 }}
            rate(app_errors_total{job="{{ $appName }}"}[5m]) or on(route,tenant_id) rate(app_requests_total{job="{{ $appName }}"}[5m])
            {{- else if eq $i 9 }}
            (rate(app_errors_total{job="{{ $appName }}"}[5m]) > 0) and on(route,tenant_id) (rate(app_requests_total{job="{{ $appName }}"}[5m]) > 0)
            {{- else }}
            rate(app_errors_total{job="{{ $appName }}"}[5m]) * on(route,tenant_id) group_left(region,version) sum by(route,tenant_id,region,version) (rate(app_requests_total{job="{{ $appName }}"}[5m])) > {{ add 50 $i }}
            {{- end }}
            {{- /* 15% label_replace и label_join (3 правила: i=11..13) */}}
            {{- else if lt $i 14 }}
            {{- if eq $i 11 }}
            sum by (tenant_route) (label_replace(rate(app_errors_total{job="{{ $appName }}"}[5m]), "tenant_route", "$1", "tenant_id", "(.*)")) > {{ add 60 $i }}
            {{- else if eq $i 12 }}
            sum by (tenant_route) (label_join(rate(app_requests_total{job="{{ $appName }}"}[5m]), "tenant_route", "-", "tenant_id", "route")) > {{ add 70 $i }}
            {{- else }}
            label_replace(sum by (tenant_id) (rate(app_errors_total{job="{{ $appName }}"}[5m])), "tenant_group", "group-$1", "tenant_id", "tenant-(.*)") > {{ add 80 $i }}
            {{- end }}
            {{- /* 15% histogram_quantile по высококардинальной оси (3 правила: i=14..16) */}}
            {{- else if lt $i 17 }}
            {{- if eq $i 14 }}
            histogram_quantile(0.99, sum by (le, tenant_id, route) (rate(app_request_latency_seconds_bucket{job="{{ $appName }}"}[5m]))) > {{ add 90 $i }}
            {{- else if eq $i 15 }}
            histogram_quantile(0.95, sum by (le, tenant_id, route) (rate(app_request_duration_seconds_bucket{job="{{ $appName }}"}[5m]))) > {{ add 100 $i }}
            {{- else }}
            histogram_quantile(0.999, sum by (le, tenant_id, route, status_code) (rate(app_request_latency_seconds_bucket{job="{{ $appName }}"}[5m]))) > {{ add 110 $i }}
            {{- end }}
            {{- /* 15% over_time + predict_linear + topk + absent (3 правила: i=17..19) */}}
            {{- else }}
            {{- if eq $i 17 }}
            quantile_over_time(0.95, app_request_latency_seconds_count{job="{{ $appName }}"}[10m]) > {{ add 120 $i }}
            {{- else if eq $i 18 }}
            stddev_over_time(rate(app_errors_total{job="{{ $appName }}"}[5m])[10m:1m]) > {{ add 130 $i }}
            {{- else if eq $i 19 }}
            predict_linear(app_inflight_requests{job="{{ $appName }}"}[15m], 300) > {{ add 140 $i }}
            {{- end }}
            {{- end }}
            {{- /* простой профиль для оставшихся правил */}}
            {{- else if eq (mod $i 10) 0 }}
            (1000 * rate(app_errors_total{job="{{ $appName }}"}[1m]) / clamp_min(rate(app_requests_total{job="{{ $appName }}"}[1m]), 0.001)) > {{ add 20 $i }}
            {{- else if eq (mod $i 10) 1 }}
            (1000 * rate(app_errors_total{job="{{ $appName }}"}[5m]) / clamp_min(rate(app_requests_total{job="{{ $appName }}"}[5m]), 0.001)) > {{ add 30 $i }}
            {{- else if eq (mod $i 10) 2 }}
            (histogram_quantile(0.95, sum(rate(app_request_latency_seconds_bucket{job="{{ $appName }}"}[5m])) by (le)) * 1000) > {{ add 250 (mul $i 2) }}
            {{- else if eq (mod $i 10) 3 }}
            (histogram_quantile(0.99, sum(rate(app_request_latency_seconds_bucket{job="{{ $appName }}"}[5m])) by (le)) * 1000) > {{ add 400 (mul $i 3) }}
            {{- else if eq (mod $i 10) 4 }}
            (1000 * rate(app_request_latency_seconds_sum{job="{{ $appName }}"}[5m]) / clamp_min(rate(app_request_latency_seconds_count{job="{{ $appName }}"}[5m]), 0.001)) > {{ add 200 (mul $i 2) }}
            {{- else if eq (mod $i 10) 5 }}
            app_goroutines{job="{{ $appName }}"} > {{ add 25 $i }}
            {{- else if eq (mod $i 10) 6 }}
            max_over_time(app_goroutines{job="{{ $appName }}"}[3m]) > {{ add 35 $i }}
            {{- else if eq (mod $i 10) 7 }}
            increase(app_errors_total{job="{{ $appName }}"}[2m]) > {{ add 5 $i }}
            {{- else if eq (mod $i 10) 8 }}
            increase(app_requests_total{job="{{ $appName }}"}[5m]) > {{ add 50 (mul $i 5) }}
            {{- else }}
            avg_over_time(app_goroutines{job="{{ $appName }}"}[5m]) > {{ add 20 $i }}
            {{- end }}
          for: {{ ternary "2m" "1m" (eq (mod $i 2) 0) }}
          labels:
            severity: {{ ternary "critical" "warning" (eq (mod $i 5) 0) }}
            app: {{ $appName }}
            extra: "true"
            extra_id: "{{ add $i 1 }}"
            {{- if $heavy }}
            heavy: "true"
            {{- end }}
          annotations:
            summary: "Alert {{ printf "%03d" (add $i 1) }} on {{ $appName }}"
            description: "{{ $.Values.alerts.extra.descriptionPrefix }} #{{ add $i 1 }} for {{ $appName }}. Value is {{ `{{ $value }}` }}"
        {{- end }}
        {{- end }}
