# Goldpinger — проверка и визуализация сетевой связности между нодами кластера.
# Helm: goldpinger/goldpinger 1.0.2 (app 3.10.3) — см. README.
# Чарт: https://github.com/bloomberg/goldpinger/tree/master/charts/goldpinger

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: goldpinger.apatsev.org.ru
      paths:
        - path: /
          pathType: Prefix

# ServiceMonitor — для kube-prometheus; со стеком VictoriaMetrics используйте goldpinger-vmscrape.yaml.
serviceMonitor:
  enabled: false
