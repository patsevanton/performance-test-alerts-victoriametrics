# VictoriaLogs cluster — хранилище логов (LogsQL).
# Helm: vm/victoria-logs-cluster 0.0.31 (app v1.48.0) — см. README.
# Адаптировано из https://github.com/patsevanton/performance-test-alerts-victoriametrics
# Требование: VictoriaMetrics K8s Stack установлен первым (CRD VMServiceScrape).

vlselect:
  vmServiceScrape:
    enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - name: victorialogs.apatsev.org.ru
        path:
          - /
        port: http

vlinsert:
  vmServiceScrape:
    enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi

vlstorage:
  vmServiceScrape:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  retentionPeriod: 1d
  persistentVolume:
    size: 20Gi
