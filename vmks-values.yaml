grafana:
  ingress:
    ingressClassName: nginx
    enabled: true
    hosts:
      - grafana.apatsev.org.ru

defaultDatasources:
  victoriametrics:
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        isDefault: true
        jsonData:
          httpMethod: POST
          queryTimeout: 300s

vmsingle:
  enabled: false

vmcluster:
  enabled: true
  spec:
    replicationFactor: 2

    vmstorage:
      # Иначе оператор подмешивает свои CPU defaults поверх requests из values.
      useDefaultResources: false
      replicaCount: 2
      # Поиск выполняется на vmstorage; дефолт maxConcurrentRequests=2 даёт 503 «couldn't start executing in 10s»
      # при параллельных запросах от vmselect/vmalert (см. также vmselect.extraArgs).
      extraArgs:
        search.maxConcurrentRequests: "16"
        search.maxQueueDuration: "60s"
        # С v1.105.0 лимит auto-calculated и может быть слишком мал при 16 concurrent + 4Gi;
        # фиксируем явно, чтобы query вроде topk(5, sum(vmalert_alerts_firing{…}) by(…)) не падал с 422.
        # vmalert_alerting_rules_last_evaluation_samples — по ряду на правило; при >1M правил 1M мало (422 TooManyTimeseries).
        search.maxUniqueTimeseries: "5000000"
      resources:
        limits:
          cpu: "2"
          memory: 4Gi
        requests:
          cpu: 250m
          memory: 1Gi

    vmselect:
      useDefaultResources: false
      replicaCount: 2
      # При большом числе VMRule vmalert шлёт много запросов (restore ALERTS_FOR_STATE + eval).
      # Дефолт maxConcurrentRequests=2 даёт 429 и "couldn't start executing in 10s".
      extraArgs:
        search.maxConcurrentRequests: "16"
        search.maxQueueDuration: "60s"
        # Согласовать с queryTimeout в defaultDatasources (иначе vmselect обрежет раньше Grafana).
        search.maxQueryDuration: 300s
        search.maxLabelsAPIDuration: 120s
        # Согласовать с vmstorage: иначе тяжёлые запросы по vmalert_* могут резаться на одном из слоёв.
        search.maxUniqueTimeseries: "5000000"
      resources:
        limits:
          cpu: "1"
          memory: 1536Mi
        requests:
          cpu: 200m
          memory: 512Mi
    vminsert:
      replicaCount: 2
      resources:
        limits:
          memory: 768Mi
          cpu: "500m"
        requests:
          memory: 384Mi
          cpu: 50m

  ingress:
    select:
      enabled: true
      ingressClassName: nginx
      hosts:
        - vmselect.apatsev.org.ru

alertmanager:
  spec:
    replicaCount: 2
    podDisruptionBudget:
      minAvailable: 1

    resources:
      limits:
        cpu: "1"
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 256Mi

vmalert:
  spec:
    replicaCount: 2
    podDisruptionBudget:
      minAvailable: 1

    resources:
      limits:
        cpu: "2"
        memory: 3Gi
      requests:
        cpu: "500m"
        memory: 2Gi

vmagent:
  spec:
    extraArgs:
      promscrape.maxScrapeSize: "134217728"
    resources:
      limits:
        cpu: "1"
        memory: 768Mi
      requests:
        cpu: 250m
        memory: 256Mi

victoria-metrics-operator:
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 512Mi
