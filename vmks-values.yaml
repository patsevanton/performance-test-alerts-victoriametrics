grafana:
  ingress:
    ingressClassName: nginx
    enabled: true
    hosts:
      - grafana.apatsev.org.ru

# SLA 99.9 для хранилища метрик: уходим от SPOF `vmsingle` к реплицируемому `VMCluster`.
# Это "настоящая" HA: потеря pod/ноды не равна потере сервиса и данных.
vmsingle:
  enabled: false # было true по умолчанию

vmcluster:
  enabled: true # было false по умолчанию
  spec:
    # Храним каждую точку минимум в 2 копиях на vmstorage.
    replicationFactor: 2

    vmstorage:
      # Минимум 2 реплики, чтобы replicationFactor=2 имел смысл.
      replicaCount: 2

    # VMSelect и VMInsert тоже без SPOF: по 2 реплики.
    vmselect:
      replicaCount: 2
      # При большом числе VMRule vmalert шлёт много запросов (restore ALERTS_FOR_STATE + eval).
      # Дефолт maxConcurrentRequests=2 даёт 429 и "couldn't start executing in 10s".
      extraArgs:
        search.maxConcurrentRequests: "16"
        search.maxQueueDuration: "60s"
      # Увеличиваем ресурсы: без лимита памяти vmselect при ~1.3k+ VMRule получает десятки тысяч
      # одновременных запросов (vmalert restore ALERTS_FOR_STATE + eval), потребление памяти растёт
      # и под падает с OOMKilled (Exit Code 137). Лимит 1Gi предотвращает OOM при пиках нагрузки.
      resources:
        limits:
          memory: 1Gi
        requests:
          memory: 256Mi
    vminsert:
      replicaCount: 2

  ingress:
    select:
      enabled: true
      ingressClassName: nginx
      hosts:
        - vmselect.apatsev.org.ru

# HA для доставки уведомлений: Alertmanager в кластерном режиме.
# Важно для SLA alerting pipeline: падение 1 pod/ноды не должно останавливать прием алертов.
alertmanager:
  spec:
    replicaCount: 2
    # Защищаемся от добровольных disruption'ов (drain/upgrade) так, чтобы 2 pod оставалось.
    podDisruptionBudget:
      minAvailable: 1

    resources:
      limits:
        # Дефолтные 100m вызывают 100%-й throttling и рестарты при ≥260 правилах.
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 256Mi

vmalert:
  spec:
    # HA для оценки правил: 2 реплики, чтобы падение pod/ноды не останавливал оценку.
    # Чтобы НЕ получить двойные нотификации, см. раздел в README: у реплик должны быть одинаковые labels алертов.
    replicaCount: 2
    # Защита от disruption'ов (drain/upgrade): минимум 1 pod должен оставаться.
    podDisruptionBudget:
      minAvailable: 1

    resources:
      limits:
        # 1 CPU вызывал 100%-й throttling при 260 правилах (999m/1000m).
        # Удваиваем, чтобы оставить запас для роста числа правил.
        cpu: "2"
        memory: 2Gi
      requests:
        cpu: 1200m
        memory: 2Gi

# VMAgent: при ~1100+ VMRule (31 000+ алертов) эндпоинт /metrics vmalert превышает
# дефолтный maxScrapeSize (16 МБ), и vmagent перестаёт скрейпить vmalert целиком.
# Увеличиваем до 128 МБ с запасом на дальнейший рост числа правил.
vmagent:
  spec:
    extraArgs:
      promscrape.maxScrapeSize: "134217728"

# VM Operator: при 39 VMRule потребляет 236m CPU; при 1200+ VMRule
# потребление растёт пропорционально и 512Mi памяти вызывает OOM → CrashLoopBackOff.
victoria-metrics-operator:
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
